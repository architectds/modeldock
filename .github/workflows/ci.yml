name: CI

# Reusable only. This suite is a release gate: release.yml's `ci` job calls it when a v*
# tag is pushed, and nothing else can start it. There is deliberately no push,
# pull_request or workflow_dispatch trigger - a change to main is gated locally (npm test
# plus the built-bundle e2e that reproduces the fix), never by a hosted run. No run is
# expected on a push, and that is the point: the suite is a release gate, not a ritual.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # dist/ is gitignored (not committed) but test/install-mock.test.mjs and the
      # boot smoke need the built bundle, so build before testing.
      - run: npm run build
      # The release gate, as two named lanes rather than one glob, so a failure says what
      # kind of thing broke. `test:fast` is the same command a developer or an agent runs
      # before pushing - needs nothing but this checkout and a loopback port - so the gate
      # and the local check cannot drift into different questions. `test:host` is the
      # launcher/installer discipline: same code, but it drives real processes and shells,
      # so it gets its own step and its own failure message.
      - name: Suite (no elevated rights)
        run: npm run test:fast
      - name: Suite (launchers and installers)
        run: npm run test:host
      # The LIVE lane (real installed Codex) is deliberately not here: it self-skips on a
      # runner with no Codex, so it would only ever report that it skipped. It is a
      # developer's `npm run test:live`, run on a machine that has the client.
      #
      # The browser render leg drives a real Chrome over CDP. It was made advisory for one
      # release after v0.3.85 was blocked by a Chrome that stayed alive without ever
      # publishing a page target - a runner failure, not a product failure - and it cleared
      # v0.3.86 with the leg passing and the failure-summary step skipped, which is the
      # condition for gating again. The relaunch-once handling in the test is what carried
      # it: if this step goes red again on a startup/timeout line rather than a render
      # assertion, put the continue-on-error back and fix the launcher, because a leg that
      # cannot run reliably on a runner is not a gate, it is a coin flip.
      - name: Dashboard render check
        id: browser
        run: |
          set -o pipefail
          npm run test:browser 2>&1 | tee browser-render.log
      - name: Surface browser render output in the run summary
        # Must be always(): now that the leg blocks, a failing step aborts the job before
        # any later step runs, and the summary - the one readable diagnostic for an
        # anonymous reader - would never be written.
        if: always() && steps.browser.outcome == 'failure'
        run: |
          {
            echo "### dashboard render leg failed"
            echo "Only this leg can see what users actually get on screen, so read the tail."
            echo '```'
            tail -120 browser-render.log 2>/dev/null || echo "(no log captured)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Bundle boot smoke test
        run: |
          MODELDOCK_PORT=4979 MODELDOCK_MODEL_PROBE_ENABLED=0 node dist/modeldock.mjs &
          SERVER_PID=$!
          for i in $(seq 1 20); do
            if curl -sf -o /dev/null http://127.0.0.1:4979/; then break; fi
            sleep 0.5
          done
          curl -sf -o /dev/null http://127.0.0.1:4979/ || { kill $SERVER_PID; exit 1; }
          curl -sf -o /dev/null http://127.0.0.1:4979/app.js || { kill $SERVER_PID; exit 1; }
          kill $SERVER_PID

  # install.ps1 only runs on Windows; exercise the Windows mock install end to end.
  install-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test test/install-mock.test.mjs
      # The macOS install branch is modeled with fake uname/launchctl; Windows
      # runners without WSL skip it automatically.
      - run: node --test test/install-macos-sim.test.mjs

  # install.sh on a real macOS runner. macos-latest is an Apple Silicon (arm64)
  # hosted image, so this leg exercises the launchd paths, the /opt/homebrew node
  # layout, open, and the $HOME/.modeldock install layout.
  install-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test test/stt-mac-helper.test.mjs
      # Lifecycle test (native macOS install.sh + fake launchctl sandbox).
      # tee the test output and surface the tail in the run summary on failure:
      # summaries are readable without signing in, job logs are not, and this
      # job has never been green - the summary is the only anonymous diagnostic.
      - name: Mock install test
        # Advisory until it has passed once: a leg that has never been green
        # trains everyone to ignore the whole CI run, which is worse than not
        # gating on it. The summary tail below still surfaces the diagnostic;
        # remove this line the first time the step passes so regressions gate
        # again.
        id: mock-install
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node --test test/install-mock.test.mjs 2>&1 | tee mock-install.log
      - name: macOS branch simulation
        shell: bash
        run: node --test test/install-macos-sim.test.mjs
      - name: Surface failure output in the run summary
        # continue-on-error makes the step's conclusion "success", so a plain
        # failure() would never fire again; the outcome still says what happened.
        if: failure() || steps.mock-install.outcome == 'failure'
        shell: bash
        run: |
          {
            echo "### install-macos mock test output (tail)"
            echo '```'
            tail -120 mock-install.log 2>/dev/null || echo "(no log captured)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
