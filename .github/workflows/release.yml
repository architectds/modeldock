name: Release

on:
  push:
    # Only tag for real user-approved releases. Never push a v* tag for test,
    # verification, or harness changes; those go to main without a version bump.
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # dist/ is gitignored (not committed) but test/install-mock.test.mjs and the
      # build artifact need the built bundle, so build before testing.
      - run: npm run build
      - run: npm test
      - name: Check tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match package.json version $PKG" >&2
            exit 1
          fi
      - name: Generate checksums
        run: |
          cd dist && sha256sum modeldock.mjs mcp-standalone.mjs > SHA256SUMS
          cd ../scripts && sha256sum install.ps1 install.sh start-hidden.ps1 restart.ps1 recover.ps1 start-hidden.sh restart.sh recover.sh >> ../dist/SHA256SUMS
          cd ../dist && cat SHA256SUMS
      # Re-tagging an existing version must refresh its assets rather than fail:
      # `gh release create` errors when the release already exists, so upload with
      # --clobber in that case (release notes are kept).
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSETS="dist/modeldock.mjs dist/mcp-standalone.mjs dist/SHA256SUMS scripts/install.ps1 scripts/install.sh scripts/start-hidden.ps1 scripts/restart.ps1 scripts/recover.ps1 scripts/start-hidden.sh scripts/restart.sh scripts/recover.sh"
          # Delete any existing release first (the tag itself is kept). Uploading into
          # one is not safe: deleting a tag turns its release into a draft, and a draft
          # keeps accepting asset uploads while serving 404 on the public download URLs -
          # the workflow goes green while nothing is actually published.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Removing the existing $GITHUB_REF_NAME release before republishing"
            gh release delete "$GITHUB_REF_NAME" --yes
          fi
          gh release create "$GITHUB_REF_NAME" $ASSETS \
            --title "ModelDock $GITHUB_REF_NAME" \
            --generate-notes
          # A green workflow is not proof the assets are reachable - verify.
          for f in modeldock.mjs mcp-standalone.mjs SHA256SUMS install.ps1 install.sh start-hidden.ps1 restart.ps1 recover.ps1 start-hidden.sh restart.sh recover.sh; do
            gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | grep -qx "$f" \
              || { echo "asset $f missing from the published release" >&2; exit 1; }
          done

  verify-install:
    runs-on: windows-latest
    needs: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Real end-to-end install verification, not the mock: downloads install.ps1
      # from the main branch (the exact user bootstrap URL), installs the just-
      # published release assets into a temp root, boots the gateway, checks
      # /healthz, lists MCP tools through the installed bridge, restarts, and
      # cleans up. Runs under Windows PowerShell 5.1 so the octet-stream byte[]
      # checksum behavior of the real GitHub feed is exercised.
      - name: Verify release installs end to end
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\verify-release-install.ps1
